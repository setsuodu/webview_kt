# 编译 release APK 并上传 Artifact
# - 无正式密钥时用 debug.keystore（可安装，便于测试）
# - 配置 GitHub Secrets 后自动用正式签名
# Secrets（可选，正式发布时配置）:
#   KEYSTORE_BASE64   — keystore 文件 base64（base64 -w0 release.jks）
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # v3 会装已下架的 tools 包导致 Failed to find package 'tools'
      # v4 默认/显式只装 platform-tools，避免该问题
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 若配置了 KEYSTORE_BASE64，解码为正式密钥；否则后续用 debug.keystore
      - name: Decode release keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Ensure debug.keystore exists (fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK outputs
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "No signed release APK found"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"
          ls -lh "$APK"
          # v4 可能额外生成 .idsig
          IDSIG="${APK}.idsig"
          if [ -f "$IDSIG" ]; then
            echo "idsig=$IDSIG" >> "$GITHUB_OUTPUT"
            ls -lh "$IDSIG"
          fi

      - name: Verify APK signatures (v1/v2/v3)
        run: |
          set -e
          APK="${{ steps.apk.outputs.path }}"
          # 取最新 build-tools 中的 apksigner
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          echo "Using: $APKSIGNER"
          "$APKSIGNER" verify -v --print-certs "$APK" | tee /tmp/apk-verify.txt
          # 必须至少有 v2 或 v3（Android 7+ / 9+）
          if ! grep -qE "Verified using v[23] scheme" /tmp/apk-verify.txt; then
            echo "::error::Missing v2/v3 signature — install may fail on modern Android"
            exit 1
          fi
          echo "Signature check OK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: webview-release-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.idsig }}
          if-no-files-found: error
          retention-days: 30
